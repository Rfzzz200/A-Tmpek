name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt update && sudo apt install -y openjdk-17-jdk git zip unzip autoconf libtool pkg-config cmake zlib1g-dev libsdl2-dev
          python -m pip install --upgrade pip
          pip install "cython==0.29.33" "buildozer==1.5.0"

      - name: Build APK
        run: yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: bin/*.apk
          

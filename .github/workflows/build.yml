name: Build and Test

# Menentukan kapan workflow ini akan dijalankan (trigger)
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Kumpulan pekerjaan yang akan dijalankan
jobs:
  build:
    # Menentukan sistem operasi runner
    runs-on: ubuntu-latest

    steps:
      # 1. Mengambil kode dari repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Menyiapkan lingkungan (misalnya Node.js)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Menginstal dependensi proyek
      - name: Install Dependencies
        run: npm install

      # 4. Menjalankan proses build atau testing
      - name: Run Build
        run: npm run build
